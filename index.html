<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Dokumen</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#efefef;
}

.container{
    width:320px;
    margin:auto;
    background:#fff;
    padding:0;
}

.banner{
    width:320px;
    display:block;
}

.form-group{
    width:280px;
    margin:8px auto 0;
}

.form-group label{
    font-size:10px;
    margin-bottom:2px;
}

.form-group select,
.form-group input{
    width:280px;
    height:22px;
    font-size:10px;
    padding:2px 4px;
}

.btn-cari{
    margin-left:20px;
    margin-top:4px;
    height:24px;
    padding:0 10px;
    font-size:12px;
    border:none;
    background:#00a651;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
}

.btn-cari:hover{
    background:#00984a;
}

.icon{
    font-size:11px;
    color:white;
}
.mobile-menu{
    display:none;
    background:#fff;
    border:1px solid #ddd;
}

.mobile-menu.show{
    display:block;
}

.menu-item{
    padding:12px;
    border-bottom:1px solid #eee;
}

.header{
    display:flex;
    justify-content:flex-end;
    padding:8px 10px;
}

.menu-btn{
    width:16px;
    height:8px;
    background:#e5e5e5;
    border:1px solid #d8d8d8;
    border-radius:2px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<div class="header">
    

    <button id="menuBtn" class="menu-btn"></button>
</div>

<div id="menu" class="mobile-menu">
    <div class="menu-item">PELAYANAN ▶</div>
    <div class="menu-item">IHR ▶</div>
    <div class="menu-item">BERITA ▶</div>
    <div class="menu-item">PERATURAN</div>
    <div class="menu-item">VISI MISI</div>
    <div class="menu-item">FASKES</div>
    <div class="menu-item">LOGIN</div>
</div>

    <img src="contoh.png" class="banner">

<div class="form-group">
    <label>Jenis Dokumen</label>
    <input type="text" value="ICV" readonly>
</div>

<div class="form-group">
    <label>Nomor Dokumen/IMO/Barcode</label>
    <input type="text" value="E25-000236400" readonly>
</div>

<button class="btn-cari">
    <span class="icon">⌕</span>
    Cari
</button>

<div style="height:20px;"></div> 
<img src="contoh2.png" class="banner">
<img src="contoh3.png" class="banner">

</div>

```html
<script>
document.addEventListener('DOMContentLoaded', function () {

    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('menu');

    btn.addEventListener('click', function () {
        menu.classList.toggle('show');
    });

});
</script>
```


</body>
</html>
</body>
</html>
